# IDD Music en producción (cd.com.py).
#   docker compose up -d --build                    → web en 127.0.0.1:8080 (detrás del Nginx/Apache del servidor)
#   docker compose --profile https up -d --build    → además Caddy con HTTPS automático (si los puertos 80/443 están libres)
# Ver docs/DESPLIEGUE.md
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idd_music}
      POSTGRES_USER: ${POSTGRES_USER:-idd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - idd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [iddnet]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-idd_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-idd_music}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - idd_uploads:/srv/backend/storage/uploads
    networks: [iddnet]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on: [api]
    networks: [iddnet]

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-cd.com.py}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [iddnet]

volumes:
  idd_pgdata:
  idd_uploads:
  caddy_data:
  caddy_config:

networks:
  iddnet:
    driver: bridge
