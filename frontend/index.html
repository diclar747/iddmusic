<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SION Music · Cancionero y proyección para iglesias</title>
  <meta name="description" content="SION Music: cancionero con acordes, repertorios, proyección y vista de músicos para iglesias" />
  <meta name="theme-color" content="#0d1d33" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SION Music" />
  <meta name="application-name" content="SION Music" />
  <style>
    /* Pantalla de inicio (se ve mientras carga la app y al abrirla instalada) */
    #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;color:#fff;
      background:radial-gradient(ellipse at 50% 35%,#2a5689 0%,#14294a 45%,#070f1d 100%);font-family:'Segoe UI',system-ui,Arial,sans-serif;transition:opacity .5s ease,visibility .5s}
    #splash.out{opacity:0;visibility:hidden}
    #splash .logo-full{width:min(260px,62vw);height:auto;filter:drop-shadow(0 10px 30px #0008);animation:sp-in .9s cubic-bezier(.2,.8,.2,1)}
    #splash .logo-full.church{width:132px;height:132px;border-radius:50%;object-fit:contain;padding:18px;background:radial-gradient(circle at 50% 40%,#21436e,#0d1d33);box-shadow:0 0 0 4px #d9a441,0 0 60px #f0c75e55}
    #splash .logo-full.church.fill{padding:0;object-fit:cover;background:none}
    #splash h1:empty{display:none}
    #splash .ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative;
      background:radial-gradient(circle at 50% 40%,#21436e,#0d1d33);box-shadow:0 0 0 4px #d9a441,0 0 60px #f0c75e55,0 20px 50px #0008;animation:sp-in .9s cubic-bezier(.2,.8,.2,1)}
    #splash .ring img{width:58%;filter:drop-shadow(0 4px 10px #0007);animation:sp-flame 2.4s ease-in-out infinite}
    #splash h1{margin:22px 0 0;font-size:34px;letter-spacing:2px;font-weight:800;animation:sp-up .8s .15s both}
    #splash h1 span{color:#f0c75e}
    #splash p{margin:0;color:#c9d6e8;font-size:15px;letter-spacing:.5px;animation:sp-up .8s .25s both}
    #splash em{margin-top:14px;color:#f0c75e;font-size:18px;font-family:Georgia,'Times New Roman',serif;animation:sp-up .8s .35s both}
    #splash .bar{width:120px;height:3px;border-radius:3px;margin-top:30px;background:#ffffff22;overflow:hidden;animation:sp-up .8s .45s both}
    #splash .bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,#f0c75e,#fff1c4);border-radius:3px;animation:sp-load 1.1s ease-in-out infinite}
    @keyframes sp-in{from{transform:scale(.6);opacity:0}}
    @keyframes sp-up{from{transform:translateY(12px);opacity:0}}
    @keyframes sp-flame{50%{transform:translateY(-3px) scale(1.04)}}
    @keyframes sp-load{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img class="logo-full" src="/icons/sion-logo.png" alt="SION Music" />
    <h1></h1>
    <p>Cancionero y proyección para tu iglesia</p>
    <em>Un lugar de adoración y presencia de Dios</em>
    <div class="bar"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
