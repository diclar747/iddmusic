# Nginx del servidor (fuera de Docker) → contenedor web en 127.0.0.1:8080.
# Copiar a /etc/nginx/sites-available/cd.com.py, enlazar en sites-enabled y obtener el certificado:
#   sudo certbot --nginx -d cd.com.py -d www.cd.com.py
server {
    listen 80;
    server_name cd.com.py www.cd.com.py;
    client_max_body_size 30m;

    location /api/live/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
